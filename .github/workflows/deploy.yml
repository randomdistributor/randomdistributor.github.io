name: Deploy apps to GitHub Pages

# Builds all three Flutter Web apps and publishes them to GitHub Pages:
#   admin    -> https://randomdistributor.github.io/
#   buyer    -> https://randomdistributor.github.io/buyer/
#   supplier -> https://randomdistributor.github.io/supplier/
# Runs on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build admin (root)
        working-directory: admin
        run: |
          flutter pub get
          flutter build web --release --base-href /

      - name: Build buyer (/buyer/)
        working-directory: apps/buyer
        run: |
          flutter pub get
          flutter build web --release --base-href /buyer/

      - name: Build supplier (/supplier/)
        working-directory: apps/supplier
        run: |
          flutter pub get
          flutter build web --release --base-href /supplier/

      - name: Assemble site
        run: |
          rm -rf public && mkdir -p public
          cp -r admin/build/web/. public/
          mkdir -p public/buyer && cp -r apps/buyer/build/web/. public/buyer/
          mkdir -p public/supplier && cp -r apps/supplier/build/web/. public/supplier/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
